# Starship prompt in the style of tide (rainbow, one-line) - right prompt only in fish/zsh
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
command_timeout = 1000

# Left: directory + git
format = "$directory($git_branch$git_state[](fg:#4E9A06)) "

# Right: status, duration, context, tools
right_format = """
[](fg:#444444)\
$status\
$cmd_duration\
$username\
$hostname\
$jobs\
$direnv\
$python\
$nodejs\
$golang\
$rust\
$terraform\
$docker_context\
$aws\
$openstack\
"""

# ---------- left ----------

[directory]
style = "bg:#3465A4 fg:#E4E4E4"
read_only = " "
read_only_style = "bg:#3465A4 fg:#E4E4E4"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = false
# outside a repo: segment ends here
format = "[ $path$read_only ]($style)[](fg:#3465A4)"
# inside a repo: transitions directly into the green git segment
repo_root_style = "bg:#3465A4 fg:#E4E4E4 bold"
before_repo_root_style = "bg:#3465A4 fg:#BCBCBC"
repo_root_format = "[ $before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path$read_only ]($style)[](fg:#3465A4 bg:#4E9A06)"

[git_branch]
symbol = ""
style = "bg:#4E9A06 fg:#000000"
truncation_length = 24
truncation_symbol = "…"
format = "[ $branch(:$remote_branch)]($style)"

[git_state]
style = "bg:#4E9A06 fg:#CC0000 bold"
format = "[ $state( $progress_current/$progress_total)]($style)"

# ---------- right ----------

[status]
disabled = false
symbol = "✘"
success_symbol = "[✔](bg:#444444 fg:#4E9A06)"
not_executable_symbol = "✘"
not_found_symbol = "✘"
sigint_symbol = "✘"
style = "bg:#444444 fg:#FFFF00"
format = "[ $symbol( $common_meaning)( $signal_name)( $maybe_int) ]($style)"
recognize_signal_code = true
map_symbol = false

[cmd_duration]
min_time = 3000
style = "bg:#444444 fg:#C4A000"
format = "[ $duration ]($style)"

[username]
style_user = "bg:#444444 fg:#D7AF87"
style_root = "bg:#444444 fg:#D7AF00 bold"
format = "[ $user]($style)"

[hostname]
ssh_only = true
style = "bg:#444444 fg:#D7AF87"
format = "[@$hostname ]($style)"

[jobs]
symbol = ""
style = "bg:#444444 fg:#4E9A06"
format = "[ $symbol( $number) ]($style)"

[direnv]
disabled = false
symbol = "▼"
style = "bg:#444444 fg:#D7AF00"
format = "[ $symbol $loaded/$allowed ]($style)"

[python]
symbol = "󰌠"
style = "bg:#444444 fg:#00AFAF"
format = "[ $symbol $version( \\($virtualenv\\)) ]($style)"

[nodejs]
symbol = ""
style = "bg:#444444 fg:#44883E"
format = "[ $symbol $version ]($style)"

[golang]
symbol = ""
style = "bg:#444444 fg:#00ACD7"
format = "[ $symbol $version ]($style)"

[rust]
symbol = ""
style = "bg:#444444 fg:#F74C00"
format = "[ $symbol $version ]($style)"

[terraform]
symbol = "󱁢"
style = "bg:#444444 fg:#CC66CC"
format = "[ $symbol $workspace ]($style)"

[docker_context]
symbol = ""
style = "bg:#444444 fg:#2496ED"
format = "[ $symbol $context ]($style)"

[aws]
symbol = ""
style = "bg:#444444 fg:#FF9900"
format = "[ $symbol $profile( $region) ]($style)"

[openstack]
# shows $OS_CLOUD / project once set
symbol = "󰅟"
style = "bg:#444444 fg:#ED1944"
format = "[ $symbol $cloud(\\($project\\)) ]($style)"
