# ~/.config/tmux/tmux.conf

# ---------- Prefix & reload ----------
unbind C-b
set -g prefix C-s
bind C-s send-prefix
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ---------- Terminal ----------
set -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB:clipboard'
set -s escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g mouse on

# ---------- Panes & windows (vim style) ----------
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H resize-pane -L 10
bind J resize-pane -D 10
bind K resize-pane -U 10
bind L resize-pane -R 10
bind - split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ---------- Copy ----------
set -g set-clipboard on                                        # OSC 52 to the terminal, needed for remote hosts
if-shell 'command -v pbcopy' 'set -s copy-command "pbcopy"'     # locally also go straight through pbcopy
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# Copy the last command's output (needs the OSC-133 markers from zshrc)
bind y copy-mode \; send -X cursor-up \; send -X end-of-line \; send -X set-mark \; send -X cursor-down \; send -X previous-prompt -o \; send -X begin-selection \; send -X jump-to-mark \; send -X copy-pipe-and-cancel \; display "Copied last output"

# Same for servers without markers: finds the previous prompt via regex (user@host:path# / [user@host path]#)
bind Y copy-mode \; send -X cursor-up \; send -X end-of-line \; send -X set-mark \; send -X cursor-down \; send -X start-of-line \; send -X search-backward '^\[?[a-z_][a-z0-9_.-]*@[^ :]+[: ][^ ]*\]?[#$] ' \; send -X cursor-down \; send -X start-of-line \; send -X begin-selection \; send -X jump-to-mark \; send -X copy-pipe-and-cancel \; display "Copied last output (server)"

# ---------- Plugins ----------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dracula/tmux'

set -g @dracula-plugins "cpu-usage ram-usage"
set -g @dracula-cpu-usage-colors "pink dark_gray"
set -g @dracula-ram-usage-colors "orange dark_gray"
set -g @dracula-powerline-bg-transparent true
set -g @dracula-show-powerline true
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g status-position top

# Initialize tpm - must stay at the very bottom
run '~/.config/tmux/plugins/tpm/tpm'
