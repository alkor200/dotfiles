[general]
import = ["~/.config/alacritty/themes/themes/dark_pastels.toml"]

[env]
TERM = "xterm-256color"

[window]
padding = { x = 10, y = 10 }
decorations = "Buttonless"
option_as_alt = "OnlyLeft"

[font]
normal.family = "Lilex Nerd Font"
size = 14

[terminal]
osc52 = "CopyPaste"

[terminal.shell]
program = "/bin/zsh"
args = ["-l"]

# Shift+Enter -> newline in Claude Code
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
